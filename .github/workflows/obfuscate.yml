name: Build and Obfuscate miliconfig Worker & Pages

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'

jobs:
  build-and-obfuscate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install javascript-obfuscator
        run: npm install --no-save javascript-obfuscator terser

      - name: Build & Obfuscate Modular Project
        run: npm run build

      - name: Run Verification Test Suite
        run: npm test

      - name: Commit Updated Obfuscated Artifacts
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add _worker.js dist/_worker.js public/_worker.js '少年你相信光吗' '明文源吗'
          if git diff --staged --quiet; then
            echo "Artifacts are already up-to-date."
          else
            git commit -m "chore: build & obfuscate miliconfig worker and pages bundle"
            git push
          fi
