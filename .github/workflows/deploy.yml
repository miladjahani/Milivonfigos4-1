name: Release Pages & Worker Package

on:
  push:
    tags:
      - '*'

jobs:
  release-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get tag name
        id: get_tag
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and Obfuscate
        run: |
          npm install --no-save javascript-obfuscator terser
          npm run build
          npm test

      - name: Create Pages.zip
        run: |
          zip -r Pages.zip _worker.js schema.sql wrangler.toml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_tag.outputs.tag_name }}
          name: miliconfig ${{ steps.get_tag.outputs.tag_name }}
          body: |
            نسخه آماده استقرار miliconfig (پشتیبانی از Cloudflare Workers، Cloudflare Pages و دیتابیس D1)
          draft: false
          prerelease: false
          files: Pages.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
